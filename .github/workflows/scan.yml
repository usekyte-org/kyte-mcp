name: plugin-scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # report_to_hol: HOL verifies the GitHub OIDC token to attribute the score to this public repo
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan with the HOL AI Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@v1.2.816
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          report_to_hol: true
